<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --surface: #ffffff;
        --page: #fafaf9;
        --border: #e1e0d9;
        --text-primary: #0b0b0b;
        --text-secondary: #52514e;
        --text-muted: #898781;
        --good: #0ca30c;
        --critical: #d03b3b;
        --neutral: #898781;
        --warning: #b8860b;
        --warning-bg: #fffaf0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 20px;
        background: var(--page);
        color: var(--text-primary);
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .sub {
        font-size: 12px;
        color: var(--text-muted);
        margin: 0 0 18px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 18px;
        cursor: pointer;
      }
      .card-head {
        margin-bottom: 12px;
      }
      .place {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.3;
      }
      .place .ward {
        font-size: 13px;
        font-weight: 400;
        color: var(--text-secondary);
        margin-left: 6px;
      }
      .stat-row {
        display: flex;
        gap: 24px;
        margin-top: 10px;
      }
      .stat {
        display: flex;
        flex-direction: column;
      }
      .stat-label {
        font-size: 11px;
        color: var(--text-muted);
      }
      .stat-value {
        font-size: 18px;
        font-weight: 700;
        margin-top: 2px;
      }
      .stat-value .unit {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-secondary);
        margin-left: 2px;
      }
      .est-tag {
        display: inline-block;
        font-size: 10px;
        font-weight: 400;
        color: var(--text-muted);
        border: 1px solid var(--border);
        padding: 0 4px;
        margin-left: 6px;
        vertical-align: middle;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0 0;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--neutral);
        font-size: 12px;
        color: var(--text-primary);
        background: var(--surface);
        white-space: nowrap;
      }
      .badge.good {
        border-left-color: var(--good);
      }
      .badge.critical {
        border-left-color: var(--critical);
      }
      .badge .dot {
        font-size: 10px;
      }
      .badge.good .dot {
        color: var(--good);
      }
      .badge.critical .dot {
        color: var(--critical);
      }
      .badge.neutral .dot {
        color: var(--neutral);
      }
      .expand-hint {
        margin-top: 14px;
        font-size: 11px;
        color: var(--text-muted);
        text-align: right;
      }
      .detail {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
        display: none;
      }
      .card.open .detail {
        display: block;
      }
      .card.open .expand-hint {
        display: none;
      }
      .detail h3 {
        font-size: 12px;
        color: var(--text-muted);
        margin: 0 0 4px;
        font-weight: 600;
      }
      .detail p {
        font-size: 13px;
        color: var(--text-secondary);
        margin: 0 0 12px;
        white-space: pre-wrap;
      }
      .detail .infra {
        display: flex;
        gap: 24px;
        margin-bottom: 12px;
      }
      .detail .infra .stat-value {
        font-size: 16px;
      }
      .empty,
      .err {
        font-size: 13px;
        color: var(--text-muted);
        padding: 24px;
      }
      .err {
        color: var(--critical);
      }
      .tod-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 12px;
      }
      .tod-block {
        border: 1px solid var(--border);
        padding: 8px;
      }
      .tod-block h4 {
        font-size: 11px;
        color: var(--text-muted);
        margin: 0 0 4px;
        font-weight: 600;
      }
      .tod-block p {
        font-size: 12px;
        color: var(--text-secondary);
        margin: 0 0 6px;
        white-space: pre-wrap;
      }
      .tod-photo-wrap {
        border: 1px solid var(--border);
        background: #f1f0ec;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tod-photo {
        display: block;
        width: 100%;
        height: auto;
      }
      .history-list {
        margin: 0 0 12px;
        padding: 0;
        list-style: none;
      }
      .history-row {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 5px 0;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      .history-row:last-child {
        border-bottom: none;
      }
      .history-row .h-date {
        color: var(--text-muted);
        width: 92px;
        flex: none;
      }
      .history-row .h-values {
        color: var(--text-secondary);
        flex: 1;
      }
      .history-row.latest .h-date,
      .history-row.latest .h-values {
        color: var(--text-primary);
        font-weight: 700;
      }
      .history-row .h-source {
        color: var(--text-muted);
        font-weight: 400;
        font-size: 11px;
      }
      .latest-tag {
        display: inline-block;
        font-size: 9px;
        font-weight: 400;
        color: var(--good);
        border: 1px solid var(--good);
        padding: 0 4px;
        margin-left: 6px;
        vertical-align: middle;
      }
      .compare-chip {
        border: 1px solid var(--border);
        padding: 8px 10px;
        margin-top: 12px;
      }
      .compare-chip.mismatch {
        border-color: var(--warning);
        background: var(--warning-bg);
      }
      .compare-title {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
      }
      .mismatch-tag {
        font-size: 10px;
        font-weight: 400;
        color: var(--warning);
        border: 1px solid var(--warning);
        padding: 0 4px;
      }
      .compare-row {
        display: flex;
        gap: 8px;
      }
      .compare-seg {
        flex: 1;
        border-left: 3px solid var(--neutral);
        padding: 4px 8px;
        background: var(--surface);
      }
      .compare-seg.good {
        border-left-color: var(--good);
      }
      .compare-seg.critical {
        border-left-color: var(--critical);
      }
      .compare-seg-label {
        display: block;
        font-size: 10px;
        color: var(--text-muted);
      }
      .compare-seg-value {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-primary);
        margin-top: 1px;
      }
      .info-block {
        margin-bottom: 12px;
      }
      .info-block .src {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <h1>エリア候補 比較ダッシュボード</h1>
    <p class="sub">カードをクリックすると街の評判・生活インフラの詳細が開きます</p>
    <div id="root">読み込み中…</div>

    <script>
      const FIELDS = [
        "id",
        "wardName",
        "stationName",
        "commuteMinutes",
        "rentRoomOnly",
        "rentWithKitchen",
        "rentStatus",
        "rentSource",
        "rentSurveyDate",
        "rentHistory",
        "lastTrainDepartTime",
        "lastTrainArriveTime",
        "commuteStatus",
        "taxiFareEstimate",
        "taxiFareStatus",
        "wardSafetyLevel",
        "stationSafetyLevel",
        "crimeTendency",
        "violentCrimeLevel",
        "nightAtmosphere",
        "safetySource",
        "safetySurveyDate",
        "wardRivers",
        "stationFloodRisk",
        "floodHistory",
        "floodCheckReminder",
        "floodSource",
        "floodSurveyDate",
        "goodReputation",
        "complaints",
        "supermarket24hCount",
        "weekdayClinicCount",
        "morningNote",
        "morningPhoto",
        "noonNote",
        "noonPhoto",
        "nightNote",
        "nightPhoto",
        "midnightNote",
        "midnightPhoto",
        "notes",
      ];

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      // "00:53（新宿発）" -> 0 (hour). Returns null if unparsable.
      function parseHour(str) {
        if (!str) return null;
        const m = String(str).match(/(\d{1,2}):(\d{2})/);
        return m ? parseInt(m[1], 10) : null;
      }

      // "2,500〜3,000円" -> 3000 (max value found). Returns null if unparsable.
      function parseMaxYen(str) {
        if (!str) return null;
        const matches = String(str).match(/[\d,]{2,}/g);
        if (!matches) return null;
        const nums = matches.map((s) => parseInt(s.replace(/,/g, ""), 10)).filter((n) => !isNaN(n));
        return nums.length ? Math.max(...nums) : null;
      }

      function nightReturnVerdict(item) {
        const hour = parseHour(item.lastTrainDepartTime);
        const maxTaxi = parseMaxYen(item.taxiFareEstimate);
        if (hour === null || maxTaxi === null) {
          return { cls: "neutral", label: "情報不足", dot: "●" };
        }
        // 終電が0時以降（=日付が変わってから） かつ タクシー代が5000円以内
        const afterMidnight = hour < 5;
        const taxiOk = maxTaxi <= 5000;
        if (afterMidnight && taxiOk) {
          return { cls: "good", label: "深夜帰宅しやすい", dot: "●" };
        }
        return { cls: "critical", label: "深夜帰宅は要注意", dot: "●" };
      }

      function safetyLevelClass(level) {
        if (level === "上位（治安良好）") return "good";
        if (level === "下位（要注意）") return "critical";
        return "neutral"; // 中位・未評価
      }

      function floodLevelClass(risk) {
        if (risk === "低い") return "good";
        if (risk === "高い") return "critical";
        return "neutral"; // 要現地確認・未評価
      }

      function floodBadge(risk) {
        const cls = floodLevelClass(risk);
        const dot = "●";
        return { cls, label: "浸水リスク（駅周辺） " + (risk || "未評価"), dot };
      }

      // 区の治安水準と駅周辺の治安評価を並べたチップ。値が食い違う（逆転する）
      // 場合は警告色で目立たせる — 区と駅で評価が逆転するのが普通なので、
      // 一致/不一致がひと目でわかるようにする。
      function safetyCompareChip(item) {
        const ward = item.wardSafetyLevel || "";
        const station = item.stationSafetyLevel || "";
        const mismatch = !!(ward && station && ward !== station);
        return (
          '<div class="compare-chip' +
          (mismatch ? " mismatch" : "") +
          '"><div class="compare-title">治安：区 vs 駅周辺' +
          (mismatch ? '<span class="mismatch-tag">⚠ 区と駅周辺で評価が異なる</span>' : "") +
          '</div><div class="compare-row">' +
          '<div class="compare-seg ' +
          safetyLevelClass(ward) +
          '"><span class="compare-seg-label">区</span><span class="compare-seg-value">' +
          esc(ward || "未評価") +
          "</span></div>" +
          '<div class="compare-seg ' +
          safetyLevelClass(station) +
          '"><span class="compare-seg-label">駅周辺</span><span class="compare-seg-value">' +
          esc(station || "未評価") +
          "</span></div>" +
          "</div></div>"
        );
      }

      function todBlock(label, note, photoPath) {
        if (!note && !photoPath) return "";
        const photo = photoPath
          ? '<div class="tod-photo-wrap"><img class="tod-photo" data-path="' + esc(photoPath) + '" alt="' + esc(label) + 'の写真" /></div>'
          : "";
        return '<div class="tod-block"><h4>' + esc(label) + "</h4>" + (note ? "<p>" + esc(note) + "</p>" : "") + photo + "</div>";
      }

      // Renders the latest value (highlighted) plus up to 3 preceding
      // entries from item.rentHistory (a table field, appended chronologically —
      // the last entry is the newest). Falls back to nothing if no history yet.
      function rentHistoryHtml(item) {
        const hist = Array.isArray(item.rentHistory) ? item.rentHistory : [];
        if (!hist.length) return "";
        const last4 = hist.slice(-4).reverse(); // newest first, at most 4 rows
        const rows = last4
          .map((h, i) => {
            const isLatest = i === 0;
            const values = [];
            if (h.roomOnly) values.push("1R " + esc(h.roomOnly));
            if (h.withKitchen) values.push("1K " + esc(h.withKitchen));
            const valueText = values.length ? values.join(" / ") : "—";
            return (
              '<li class="history-row' +
              (isLatest ? " latest" : "") +
              '"><span class="h-date">' +
              esc(h.date || "—") +
              (isLatest ? '<span class="latest-tag">最新</span>' : "") +
              '</span><span class="h-values">' +
              valueText +
              (h.source ? ' <span class="h-source">(' + esc(h.source) + ")</span>" : "") +
              "</span></li>"
            );
          })
          .join("");
        return '<h3>家賃履歴（最新 + 過去の推移）</h3><ul class="history-list">' + rows + "</ul>";
      }

      function rentLine(item) {
        const parts = [];
        if (item.rentRoomOnly) parts.push("1R " + esc(item.rentRoomOnly));
        if (item.rentWithKitchen) parts.push("1K " + esc(item.rentWithKitchen));
        const text = parts.length ? parts.join(" / ") : "—";
        const est = item.rentStatus && item.rentStatus.indexOf("推定") !== -1 ? '<span class="est-tag">推定</span>' : "";
        return text + est;
      }

      function cardHtml(item) {
        const badges = [floodBadge(item.stationFloodRisk), nightReturnVerdict(item)];
        const badgesHtml = badges
          .map((b) => '<span class="badge ' + b.cls + '"><span class="dot">' + (b.dot || "●") + "</span>" + esc(b.label) + "</span>")
          .join("");

        const commute = item.commuteMinutes != null && item.commuteMinutes !== "" ? esc(item.commuteMinutes) + '<span class="unit">分</span>' : "—";

        const todHtml = [
          todBlock("朝", item.morningNote, item.morningPhoto),
          todBlock("昼", item.noonNote, item.noonPhoto),
          todBlock("夜", item.nightNote, item.nightPhoto),
          todBlock("深夜", item.midnightNote, item.midnightPhoto),
        ].join("");

        return (
          '<div class="card" data-id="' +
          esc(item.id) +
          '">' +
          '<div class="card-head">' +
          '<div class="place">' +
          esc(item.stationName || item.id) +
          '<span class="ward">' +
          esc(item.wardName || "") +
          "</span></div>" +
          "</div>" +
          '<div class="stat-row">' +
          '<div class="stat"><span class="stat-label">勤務先までの所要時間</span><span class="stat-value">' +
          commute +
          "</span></div>" +
          '<div class="stat"><span class="stat-label">家賃</span><span class="stat-value">' +
          rentLine(item) +
          "</span></div>" +
          "</div>" +
          '<div class="badges">' +
          badgesHtml +
          "</div>" +
          safetyCompareChip(item) +
          '<div class="expand-hint">クリックで詳細を表示 ▾</div>' +
          '<div class="detail">' +
          rentHistoryHtml(item) +
          '<div class="info-block"><h3>治安：犯罪の主な傾向</h3><p>' +
          (item.crimeTendency ? esc(item.crimeTendency) : "（未記入）") +
          "</p><p><strong>凶悪犯罪の発生水準：</strong>" +
          esc(item.violentCrimeLevel || "未評価") +
          "</p>" +
          (item.safetySource ? '<p class="src">出典: ' + esc(item.safetySource) + (item.safetySurveyDate ? "（" + esc(item.safetySurveyDate) + "調べ）" : "") + "</p>" : "") +
          "</div>" +
          '<div class="info-block"><h3>治安：夜間の雰囲気</h3><p>' +
          (item.nightAtmosphere ? esc(item.nightAtmosphere) : "（未記入）") +
          "</p></div>" +
          '<div class="info-block"><h3>浸水：区内の中小河川</h3><p>' +
          (item.wardRivers ? esc(item.wardRivers) : "（未記入）") +
          "</p></div>" +
          '<div class="info-block"><h3>浸水：過去の浸水履歴</h3><p>' +
          (item.floodHistory ? esc(item.floodHistory) : "（未記入）") +
          "</p>" +
          (item.floodSource ? '<p class="src">出典: ' + esc(item.floodSource) + (item.floodSurveyDate ? "（" + esc(item.floodSurveyDate) + "調べ）" : "") + "</p>" : "") +
          "</div>" +
          (item.floodCheckReminder ? '<div class="info-block"><h3>浸水：最終判定の確認方法</h3><p>' + esc(item.floodCheckReminder) + "</p></div>" : "") +
          "<h3>街の良い評判</h3><p>" +
          (item.goodReputation ? esc(item.goodReputation) : "（未記入）") +
          "</p>" +
          "<h3>街の不満点</h3><p>" +
          (item.complaints ? esc(item.complaints) : "（未記入）") +
          "</p>" +
          '<div class="infra">' +
          '<div class="stat"><span class="stat-label">24時間営業スーパー</span><span class="stat-value">' +
          (item.supermarket24hCount != null && item.supermarket24hCount !== "" ? esc(item.supermarket24hCount) + '<span class="unit">店</span>' : "—") +
          "</span></div>" +
          '<div class="stat"><span class="stat-label">平日診療の内科・歯科</span><span class="stat-value">' +
          (item.weekdayClinicCount != null && item.weekdayClinicCount !== "" ? esc(item.weekdayClinicCount) + '<span class="unit">件</span>' : "—") +
          "</span></div>" +
          "</div>" +
          (todHtml ? "<h3>時間帯別の街の様子</h3><div class=\"tod-grid\">" + todHtml + "</div>" : "") +
          (item.notes ? "<h3>総合メモ</h3><p>" + esc(item.notes) + "</p>" : "") +
          "</div>" +
          "</div>"
        );
      }

      // Cache of resolved photo data: URLs, keyed by workspace path — shared
      // across re-renders so re-opening a card never re-fetches a photo.
      const imageCache = new Map();

      // Throttled resolver (see config/helps/custom-view.md "Displaying images"):
      // at most 3 in flight, one retry on 429.
      async function resolveImages(paths, onResolved, workers = 3) {
        const { token, dataUrl } = window.__MC_VIEW;
        const queue = [...paths];
        const work = async () => {
          for (let path = queue.shift(); path !== undefined; path = queue.shift()) {
            let res = await fetch(dataUrl + "/image?path=" + encodeURIComponent(path) + "&maxEdge=400", {
              headers: { Authorization: "Bearer " + token },
            });
            if (res.status === 429) {
              await new Promise((r) => setTimeout(r, 500));
              res = await fetch(dataUrl + "/image?path=" + encodeURIComponent(path) + "&maxEdge=400", {
                headers: { Authorization: "Bearer " + token },
              });
            }
            if (res.ok) onResolved(path, (await res.json()).dataUrl);
          }
        };
        await Promise.all(Array.from({ length: workers }, work));
      }

      // Resolve (or reuse from cache) every time-of-day photo inside one open card.
      async function resolveCardImages(card) {
        const imgs = Array.from(card.querySelectorAll("img.tod-photo[data-path]"));
        const toFetch = [];
        imgs.forEach((img) => {
          const p = img.dataset.path;
          if (imageCache.has(p)) img.src = imageCache.get(p);
          else if (!toFetch.includes(p)) toFetch.push(p);
        });
        if (!toFetch.length) return;
        await resolveImages(toFetch, (path, src) => {
          imageCache.set(path, src);
          imgs.filter((img) => img.dataset.path === path).forEach((img) => (img.src = src));
        });
      }

      async function main() {
        const { token, dataUrl } = window.__MC_VIEW;
        const url = dataUrl + "?fields=" + encodeURIComponent(FIELDS.join(","));
        const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text()));
        const { items } = await res.json();
        const root = document.getElementById("root");
        if (!items.length) {
          root.className = "empty";
          root.textContent = "エリア候補がまだ登録されていません。";
          return;
        }
        root.className = "grid";
        root.innerHTML = items.map(cardHtml).join("");
        root.onclick = (e) => {
          const card = e.target.closest(".card");
          if (!card) return;
          const wasOpen = card.classList.contains("open");
          card.classList.toggle("open");
          if (!wasOpen) resolveCardImages(card).catch(() => {});
        };
      }

      main().catch((e) => {
        const root = document.getElementById("root");
        root.className = "err";
        root.textContent = "読み込みに失敗しました: " + e.message;
      });
      window.__MC_VIEW.onChange(() => main().catch(() => {}));
    </script>
  </body>
</html>
